name: GitHub Playwright Search + Spam/Slop Report

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  # run every ~5 minutes

permissions:
  contents: read
  issues: write

jobs:
  scrape_and_report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Playwright
      run: |
        npm init -y
        npm install playwright

    - name: Run Playwright search
      id: run_scraper
      run: |
        cat << 'EOF' > search.js
        const { chromium } = require("playwright");
        const fs = require("fs");

        (async () => {
          const searchTerms = [
            "web scraping",
            "automation tools",
            "open source projects",
            "javascript",
            "python",
            "playwright"
          ];

          const browser = await chromium.launch();
          const page = await browser.newPage();
          const allResults = [];

          for (let term of searchTerms) {
            const url = "https://github.com/search?q=" + encodeURIComponent(term);
            console.log("Searching:", term);
            await page.goto(url, { waitUntil: "domcontentloaded" });

            await page.waitForSelector("ul.repo-list li", { timeout: 5000 }).catch(() => {
              console.log("No results for", term);
              return;
            });

            const results = await page.$$eval("ul.repo-list li", nodes => {
              return nodes.map(node => {
                const titleEl = node.querySelector("a.v-align-middle");
                const descEl = node.querySelector("p.mb-1");
                const starsEl = node.querySelector("a[href*='/stargazers']");
                const descText = descEl ? descEl.innerText.trim() : "";
                const spam = /spam|test|dummy|illegal/i.test(descText);

                return {
                  searchTerm: term,
                  name: titleEl?.innerText.trim() || "",
                  url: titleEl?.href || "",
                  description: descText,
                  stars: starsEl?.innerText.trim() || "",
                  flaggedSpam: spam
                };
              });
            });

            allResults.push(...results);
            await page.waitForTimeout(1500);
          }

          await browser.close();
          fs.writeFileSync("github_search_results.json", JSON.stringify(allResults, null, 2));
        })();
        EOF

        node search.js

    - name: Create monthly summary report
      id: create_report
      run: |
        node - << 'EOF'
        const fs = require("fs");
        const results = JSON.parse(fs.readFileSync("github_search_results.json"));

        let reportText = "# Monthly GitHub Search Summary\n\n";
        const spamItems = results.filter(r => r.flaggedSpam);
        reportText += `Total repos scanned: ${results.length}\n`;
        reportText += `Flagged spam/slop count: ${spamItems.length}\n\n`;
        reportText += "## Flagged Spam/Slop Repositories\n";
        spamItems.forEach(i => {
          reportText += `- [${i.name}](${i.url}) — ${i.description}\n`;
        });
        reportText += `\nGenerated: ${new Date().toISOString()}`;
        fs.writeFileSync("monthly_report.md", reportText);
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: github-search-reports
        path: |
          github_search_results.json
          monthly_report.md

    - name: Report flagged spam/slop as GitHub Issue
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("github_search_results.json", "utf8"));
          const spamList = data.filter(x => x.flaggedSpam);
          if (spamList.length === 0) {
            console.log("No spam/slop found");
            return;
          }

          let body = "Automated spam/slop report:\n\n";
          spamList.forEach(item => {
            body += `- [${item.name}](${item.url}) — ${item.description}\n`;
          });
          body += "\n*This issue was created automatically.*";

          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Spam/Slop Report — ${spamList.length} Findings`,
            body
          });
